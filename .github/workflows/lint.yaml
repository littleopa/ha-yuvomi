name: Lint

on:
  push:
    branches: [main]
  pull_request:

jobs:
  addon-linter:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: frenck/action-addon-linter@v2
        with:
          path: ./yuvomi

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build image
        run: docker build -t ha-yuvomi:ci ./yuvomi
      - name: Smoke test
        run: |
          mkdir -p /tmp/data
          echo '{"log_level":"info","sync_interval_minutes":15,"backup_keep":7,"behind_https_proxy":false,"env_vars":[]}' > /tmp/data/options.json
          docker run -d --name y -p 3000:3000 -v /tmp/data:/data ha-yuvomi:ci
          for i in $(seq 1 30); do curl -fs http://127.0.0.1:3000/ >/dev/null && exit 0; sleep 2; done
          docker logs y; exit 1
