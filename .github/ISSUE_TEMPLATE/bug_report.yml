name: Bug report
description: Something in the Home Assistant app does not work
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting! Problems inside Yuvomi itself (a page, a feature) belong to
        [ulsklyc/yuvomi](https://github.com/ulsklyc/yuvomi/issues) – this repository covers the
        Home Assistant packaging: installation, options, sidebar, sign-in, backups.
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: What did you do, what did you expect, what happened instead?
    validations:
      required: true
  - type: input
    id: app-version
    attributes:
      label: App version
      placeholder: 2.84.0-1
    validations:
      required: true
  - type: input
    id: ha-version
    attributes:
      label: Home Assistant version and installation type
      placeholder: 2026.10.2, Home Assistant OS on Raspberry Pi 5
    validations:
      required: true
  - type: textarea
    id: config
    attributes:
      label: App configuration
      description: The options from the Configuration tab. Remove passwords and tokens.
      render: yaml
  - type: textarea
    id: log
    attributes:
      label: App log
      description: From the Log tab of the app.
      render: text
