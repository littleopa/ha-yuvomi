name: Yuvomi
version: "2.83.0-3"
slug: yuvomi
description: Self-hosted family planner – tasks, calendar, shopping, meals, budget and more
url: https://github.com/Phillipxh/ha-yuvomi/tree/main/yuvomi
arch:
  - amd64
  - aarch64
init: false
ingress: true
ingress_port: 8099
panel_icon: mdi:home-heart
panel_title: Yuvomi
webui: "http://[HOST]:[PORT:3000]"
ports:
  3000/tcp: 3000
ports_description:
  3000/tcp: Yuvomi web interface
backup: cold
options:
  base_url: ""
  sidebar_url: ""
  behind_https_proxy: false
  homeassistant_login: false
  homeassistant_url: ""
  allow_signup: false
  password_login: true
  weather_city: ""
  weather_lat: ""
  weather_lon: ""
  sync_interval_minutes: 15
  backup_keep: 7
  log_level: info
  env_vars: []
schema:
  base_url: str?
  sidebar_url: str?
  behind_https_proxy: bool
  homeassistant_login: bool
  homeassistant_url: str?
  allow_signup: bool
  password_login: bool
  weather_city: str?
  weather_lat: str?
  weather_lon: str?
  sync_interval_minutes: int(1,1440)
  backup_keep: int(1,100)
  log_level: list(debug|info|warn|error)
  env_vars:
    - match(^[A-Z][A-Z0-9_]*=.*$)
